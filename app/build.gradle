plugins {
    id 'com.android.application'
}

android {
    namespace 'com.iceinventory.onhand'
    compileSdk 36

    defaultConfig {
        applicationId 'com.iceinventory.onhand'
        minSdk 24
        targetSdk 36
        versionCode 30049
        versionName '3.0.49'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('ONHAND_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('ONHAND_STORE_PASSWORD')
                keyAlias System.getenv('ONHAND_KEY_ALIAS')
                keyPassword System.getenv('ONHAND_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
