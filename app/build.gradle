plugins {
    id 'com.android.application'
}

android {
    namespace 'com.iceinventory.onhand'
    compileSdk 36

    defaultConfig {
        applicationId 'com.iceinventory.onhand'
        minSdk 24
        targetSdk 36
        versionCode 30252
        versionName '3.0.252'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('ONHAND_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('ONHAND_STORE_PASSWORD')
                keyAlias System.getenv('ONHAND_KEY_ALIAS')
                keyPassword System.getenv('ONHAND_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    testImplementation 'junit:junit:4.13.2'
}
