name: Build iCE Onhand Inventory 3.0.24 Signed

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/3021-fixes ]
    paths:
      - 'app/**'
      - '.github/workflows/build-3021.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" > gradle.properties
      - name: Apply 3.0.24 compact list corrections
        run: |
          python3 - <<'PY'
          p='app/src/main/java/com/iceinventory/onhand/MainActivity.java'
          s=open(p,encoding='utf-8').read()
          s=s.replace('String[] parts=splitDescriptionPrice(r.description); String descText=parts[0].isEmpty()?"(No description)":parts[0];','String[] parts=splitDescriptionPrice(r.description); String descText=parts[0];')
          s=s.replace('row.addView(desc);','if(!descText.isEmpty()) row.addView(desc);',1)
          s=s.replace('row.setPadding(dp(10),dp(5),dp(10),dp(5));','row.setPadding(dp(8),dp(3),dp(8),dp(3));')
          s=s.replace('desc.setTextSize(14);','desc.setTextSize(12);')
          s=s.replace('detail.setTextSize(12);','detail.setTextSize(11);')
          s=s.replace('code.setTextSize(11);','code.setTextSize(10);')
          s=s.replace('io.setTranslationY(dp(-36));','io.setTranslationY(dp(-52));')
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Restore permanent signing keystore
        env:
          ONHAND_KEYSTORE_BASE64: ${{ secrets.ONHAND_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, re, base64
          s = os.environ.get('ONHAND_KEYSTORE_BASE64', '').strip()
          if not s:
              raise SystemExit('ONHAND_KEYSTORE_BASE64 is empty')
          if 'ONHAND_KEYSTORE_BASE64=' in s:
              s = s.split('ONHAND_KEYSTORE_BASE64=', 1)[1]
          s = s.strip().strip('"').strip("'").strip('`')
          s = re.sub(r'\s+', '', s)
          s += '=' * ((4 - len(s) % 4) % 4)
          data = base64.b64decode(s, validate=False)
          if len(data) < 100:
              raise SystemExit('Decoded keystore is unexpectedly small')
          path = os.path.join(os.environ['RUNNER_TEMP'], 'onhand-release.jks')
          with open(path, 'wb') as f:
              f.write(data)
          print(f'Keystore restored ({len(data)} bytes)')
          PY
          test -s "$RUNNER_TEMP/onhand-release.jks"
      - name: Verify signing key can be unlocked
        env:
          ONHAND_STORE_PASSWORD: ${{ secrets.ONHAND_STORE_PASSWORD }}
          ONHAND_KEY_ALIAS: ${{ secrets.ONHAND_KEY_ALIAS }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/onhand-release.jks" -storepass "$ONHAND_STORE_PASSWORD" -alias "$ONHAND_KEY_ALIAS" >/dev/null
      - name: Build signed release APK
        env:
          ONHAND_KEYSTORE_PATH: ${{ runner.temp }}/onhand-release.jks
          ONHAND_STORE_PASSWORD: ${{ secrets.ONHAND_STORE_PASSWORD }}
          ONHAND_KEY_ALIAS: ${{ secrets.ONHAND_KEY_ALIAS }}
          ONHAND_KEY_PASSWORD: ${{ secrets.ONHAND_STORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/iCE-Onhand-Inventory-3.0.24.apk"
      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "app/build/outputs/apk/release/iCE-Onhand-Inventory-3.0.24.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: iCE-Onhand-Inventory-3.0.24-signed
          path: app/build/outputs/apk/release/iCE-Onhand-Inventory-3.0.24.apk
          if-no-files-found: error
