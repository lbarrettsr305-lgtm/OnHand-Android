name: Build iCE Onhand Inventory 3.0.38 Signed

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/3021-fixes ]
    paths:
      - 'app/**'
      - 'scripts/patch_3025.py'
      - 'scripts/patch_3026.py'
      - 'scripts/patch_3027.py'
      - 'scripts/patch_3028.py'
      - 'scripts/patch_3029.py'
      - 'scripts/patch_3030.py'
      - 'scripts/patch_3031.py'
      - 'scripts/patch_3032.py'
      - 'scripts/patch_3033.py'
      - 'scripts/patch_3034b.py'
      - 'scripts/patch_3035.py'
      - 'scripts/patch_3036.py'
      - 'scripts/patch_3037.py'
      - 'scripts/patch_3038.py'
      - '.github/workflows/build-3021.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" > gradle.properties
      - name: Apply 3.0.25 layout corrections
        run: python3 scripts/patch_3025.py
      - name: Apply 3.0.26 scanner and touch corrections
        run: python3 scripts/patch_3026.py
      - name: Apply 3.0.27 quantity focus correction
        run: python3 scripts/patch_3027.py
      - name: Apply 3.0.28 quantity control and older-device focus corrections
        run: python3 scripts/patch_3028.py
      - name: Apply 3.0.29 lookup and version corrections
        run: python3 scripts/patch_3029.py
      - name: Apply 3.0.30 quantity dialog emphasis
        run: python3 scripts/patch_3030.py
      - name: Apply 3.0.31 description tap and sort options
        run: python3 scripts/patch_3031.py
      - name: Apply 3.0.32 Add Count highlight
        run: python3 scripts/patch_3032.py
      - name: Apply 3.0.33 multiplier and keyboard-friendly quantity dialog
        run: python3 scripts/patch_3033.py
      - name: Apply 3.0.34 approved iCE Inventory logo
        run: python3 scripts/patch_3034b.py
      - name: Apply 3.0.35 installation/update help
        run: python3 scripts/patch_3035.py
      - name: Apply 3.0.36 description and quantity visibility fixes
        run: python3 scripts/patch_3036.py
      - name: Apply 3.0.37 fixed-header quantity dialog
        run: python3 scripts/patch_3037.py
      - name: Apply 3.0.38 active-row keyboard visibility fix
        run: python3 scripts/patch_3038.py
      - name: Restore permanent signing keystore
        env:
          ONHAND_KEYSTORE_BASE64: ${{ secrets.ONHAND_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, re, base64
          s = os.environ.get('ONHAND_KEYSTORE_BASE64', '').strip()
          if not s: raise SystemExit('ONHAND_KEYSTORE_BASE64 is empty')
          if 'ONHAND_KEYSTORE_BASE64=' in s: s = s.split('ONHAND_KEYSTORE_BASE64=', 1)[1]
          s = s.strip().strip('"').strip("'").strip('`'); s = re.sub(r'\s+', '', s); s += '=' * ((4 - len(s) % 4) % 4)
          data = base64.b64decode(s, validate=False)
          if len(data) < 100: raise SystemExit('Decoded keystore is unexpectedly small')
          path = os.path.join(os.environ['RUNNER_TEMP'], 'onhand-release.jks')
          with open(path, 'wb') as f: f.write(data)
          PY
          test -s "$RUNNER_TEMP/onhand-release.jks"
      - name: Verify signing key can be unlocked
        env:
          ONHAND_STORE_PASSWORD: ${{ secrets.ONHAND_STORE_PASSWORD }}
          ONHAND_KEY_ALIAS: ${{ secrets.ONHAND_KEY_ALIAS }}
        run: keytool -list -keystore "$RUNNER_TEMP/onhand-release.jks" -storepass "$ONHAND_STORE_PASSWORD" -alias "$ONHAND_KEY_ALIAS" >/dev/null
      - name: Build signed release APK
        env:
          ONHAND_KEYSTORE_PATH: ${{ runner.temp }}/onhand-release.jks
          ONHAND_STORE_PASSWORD: ${{ secrets.ONHAND_STORE_PASSWORD }}
          ONHAND_KEY_ALIAS: ${{ secrets.ONHAND_KEY_ALIAS }}
          ONHAND_KEY_PASSWORD: ${{ secrets.ONHAND_STORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Prepare easy-install APK names
        run: |
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/iCE-Onhand-Inventory-3.0.38.apk"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/iCE-Onhand-Update.apk"
      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "app/build/outputs/apk/release/iCE-Onhand-Inventory-3.0.38.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: iCE-Onhand-Inventory-3.0.38-signed
          path: |
            app/build/outputs/apk/release/iCE-Onhand-Inventory-3.0.38.apk
            app/build/outputs/apk/release/iCE-Onhand-Update.apk
          if-no-files-found: error
