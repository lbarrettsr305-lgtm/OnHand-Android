name: Build iCE Onhand Inventory 3.0.21 Signed

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-3020.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" > gradle.properties
      - name: Apply 3.0.21 keyboard fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/iceinventory/onhand/MainActivity.java')
          s = p.read_text()
          s = s.replace('import android.content.SharedPreferences;\n', 'import android.content.SharedPreferences;\nimport android.content.Context;\n', 1)
          s = s.replace('import android.view.ViewGroup;\n', 'import android.view.ViewGroup;\nimport android.view.inputmethod.InputMethodManager;\n', 1)
          old = 'barcode.setText(""); description.setText(""); qty.setText(""); barcode.requestFocus(); refreshList();'
          new = 'barcode.setText(""); description.setText(""); qty.setText(""); barcode.requestFocus(); hideKeyboardAfterAdd(); refreshList();'
          if old not in s:
              raise SystemExit('Add Count focus marker not found')
          s = s.replace(old, new, 1)
          marker = '    private void scanBarcode() {'
          helper = '    private void hideKeyboardAfterAdd() {\n        barcode.postDelayed(() -> {\n            InputMethodManager imm=(InputMethodManager)getSystemService(Context.INPUT_METHOD_SERVICE);\n            if(imm!=null) imm.hideSoftInputFromWindow(barcode.getWindowToken(),0);\n        },100);\n    }\n\n'
          if marker not in s:
              raise SystemExit('scanBarcode marker not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)

          g = Path('app/build.gradle')
          t = g.read_text().replace('versionCode 30020', 'versionCode 30021').replace("versionName '3.0.20'", "versionName '3.0.21'")
          g.write_text(t)
          PY
      - name: Restore permanent signing keystore
        env:
          ONHAND_KEYSTORE_BASE64: ${{ secrets.ONHAND_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, re, base64
          s = os.environ.get('ONHAND_KEYSTORE_BASE64', '').strip()
          if not s:
              raise SystemExit('ONHAND_KEYSTORE_BASE64 is empty')
          if 'ONHAND_KEYSTORE_BASE64=' in s:
              s = s.split('ONHAND_KEYSTORE_BASE64=', 1)[1]
          s = s.strip().strip('"').strip("'").strip('`')
          s = re.sub(r'\s+', '', s)
          s += '=' * ((4 - len(s) % 4) % 4)
          try:
              data = base64.b64decode(s, validate=False)
          except Exception as e:
              raise SystemExit(f'Unable to decode keystore secret: {e}')
          if len(data) < 100:
              raise SystemExit('Decoded keystore is unexpectedly small')
          path = os.path.join(os.environ['RUNNER_TEMP'], 'onhand-release.jks')
          with open(path, 'wb') as f:
              f.write(data)
          print(f'Keystore restored ({len(data)} bytes)')
          PY
          test -s "$RUNNER_TEMP/onhand-release.jks"
      - name: Verify signing key can be unlocked
        env:
          ONHAND_STORE_PASSWORD: ${{ secrets.ONHAND_STORE_PASSWORD }}
          ONHAND_KEY_ALIAS: ${{ secrets.ONHAND_KEY_ALIAS }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/onhand-release.jks" -storepass "$ONHAND_STORE_PASSWORD" -alias "$ONHAND_KEY_ALIAS" >/dev/null
      - name: Build signed release APK
        env:
          ONHAND_KEYSTORE_PATH: ${{ runner.temp }}/onhand-release.jks
          ONHAND_STORE_PASSWORD: ${{ secrets.ONHAND_STORE_PASSWORD }}
          ONHAND_KEY_ALIAS: ${{ secrets.ONHAND_KEY_ALIAS }}
          ONHAND_KEY_PASSWORD: ${{ secrets.ONHAND_STORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/iCE-Onhand-Inventory-3.0.21.apk"
      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "app/build/outputs/apk/release/iCE-Onhand-Inventory-3.0.21.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: iCE-Onhand-Inventory-3.0.21-signed
          path: app/build/outputs/apk/release/iCE-Onhand-Inventory-3.0.21.apk
          if-no-files-found: error
