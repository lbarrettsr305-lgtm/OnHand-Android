name: Build iCE Onhand Inventory 3.0.20 Signed

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-3020.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" > gradle.properties
      - name: Restore permanent signing keystore
        env:
          ONHAND_KEYSTORE_BASE64: ${{ secrets.ONHAND_KEYSTORE_BASE64 }}
        run: |
          test -n "$ONHAND_KEYSTORE_BASE64"
          echo "$ONHAND_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/onhand-release.jks"
      - name: Build signed release APK
        env:
          ONHAND_KEYSTORE_PATH: ${{ runner.temp }}/onhand-release.jks
          ONHAND_STORE_PASSWORD: ${{ secrets.ONHAND_STORE_PASSWORD }}
          ONHAND_KEY_ALIAS: ${{ secrets.ONHAND_KEY_ALIAS }}
          ONHAND_KEY_PASSWORD: ${{ secrets.ONHAND_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/iCE-Onhand-Inventory-3.0.20.apk"
      - name: Verify APK signature
        run: apksigner verify --verbose --print-certs "app/build/outputs/apk/release/iCE-Onhand-Inventory-3.0.20.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: iCE-Onhand-Inventory-3.0.20-signed
          path: app/build/outputs/apk/release/iCE-Onhand-Inventory-3.0.20.apk
          if-no-files-found: error
